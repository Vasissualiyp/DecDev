[package]
name = "decdev"
version.workspace = true
edition.workspace = true

[[bin]]
name = "decdev"
path = "src/main.rs"

[dependencies]
decdev-core = { path = "../crates/core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
