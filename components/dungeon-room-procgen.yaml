name: Dungeon Room Procgen
category: procgen
summary: Room-and-corridor dungeon generator with seeded layout and connectivity guarantee.
description: >
  Places non-overlapping rooms inside a bounded grid, connects them with a
  minimum spanning tree plus a few extra loops, and carves corridors between
  connected rooms. Given the same seed, output is identical.
reference_games:
  - The Binding of Isaac
  - Enter the Gungeon
genre_tags: [roguelike, dungeon-crawler]
capability:
  inputs:
    - { name: seed, type: uint64 }
    - { name: room_count, type: int }
    - { name: grid_size, type: vector2int }
  outputs:
    - { name: level_grid, type: TileGrid }
    - { name: room_list, type: RectList }
  events:
    - { name: LevelGenerated }
  dependencies: [SeededRng]
  invariants:
    - "All rooms are reachable from the spawn room."
    - "No two rooms overlap."
  determinism: strict
implementations:
  - engine: Unity
    language: C#
    url: https://github.com/damarindra/Unity-Dungeon-Generator
    license: MIT
    maturity: usable
  - engine: Godot
    language: GDScript
    url: https://github.com/p-lorenzo/dungeon-crawler-3d
    license: MIT
    maturity: prototype
license: CC-BY-4.0
provenance:
  type: original
  notes: Standard BSP/MST room-gen approach described in public roguelike talks.
version: 0.1.0
compatibility:
  - with: libtcod-field-of-view
    relation: pairs-with
    note: >
      Room generation produces the tile grid the FOV transparency map is
      built from. Combine after the level grid exists and before spawning
      actors, so visibility and placement see the same map.
